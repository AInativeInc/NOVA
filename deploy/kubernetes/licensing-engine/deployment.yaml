apiVersion: apps/v1
kind: Deployment
metadata:
  name: licensing-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: licensing-engine
  template:
    metadata:
      labels:
        app: licensing-engine
    spec:
      containers:
      - name: licensing-engine
        image: ainativeinc/licensing-engine:0.1.0
        ports:
        - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: licensing-engine
spec:
  selector:
    app: licensing-engine
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
